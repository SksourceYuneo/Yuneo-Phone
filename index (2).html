<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>YUNEO — envoyer mes photos</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f8; --fg: #16161d; --muted: #6b6b7b; --card: #fff; --accent: #5b4ff2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0d12; --fg: #ececf3; --muted: #a0a0b2; --card: #15151c; --accent: #7c72ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.2rem; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 430px; background: var(--card); border-radius: 22px; padding: 1.6rem; box-shadow: 0 10px 40px -12px rgba(0,0,0,.25); text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto .8rem; display: grid; place-items: center; background: linear-gradient(135deg, #7c72ff, #4b3fe0); color: #fff; font-weight: 800; font-size: 28px; }
  h1 { font-size: 1.35rem; margin: 0 0 .4rem; } p { margin: .5rem 0; } .muted { color: var(--muted); font-size: .92rem; }
  button { appearance: none; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font: 600 1.1rem system-ui; padding: 1rem 1.4rem; width: 100%; margin-top: 1rem; }
  button:disabled { opacity: .5; } .ok { color: #1a9e6b; font-weight: 600; } .bad { color: #d6453d; font-weight: 600; }
  progress { width: 100%; height: 12px; margin-top: 1rem; } input[type=file] { display: none; } [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="logo">Y</div>
  <h1>Envoyer mes photos à YUNEO</h1>
  <p id="status" role="status">Connexion à ton ordinateur…</p>
  <p class="muted" id="hint">Garde YUNEO ouvert sur l'ordinateur. Les deux appareils doivent être sur le même Wi-Fi.</p>
  <button id="pick" hidden>Choisir les photos</button>
  <progress id="bar" max="1" value="0" hidden></progress>
  <input id="files" type="file" accept="image/*" multiple>
  <p class="muted" style="margin-top:1.4rem">Les photos passent directement de ton téléphone à ton ordinateur. Elles ne sont stockées nulle part ailleurs.</p>
</main>
<script>
(() => {
  'use strict';
  const NTFY = 'https://ntfy.sh';
  const CHUNK = 16 * 1024, MAX_SIDE = 2000, QUALITY = 0.9, WAIT_OFFER_MS = 25000, ICE_WAIT_MS = 3000;
  const $ = (id) => document.getElementById(id);
  const status = (text, cls = '') => { $('status').textContent = text; $('status').className = cls; };
  const topic = location.hash.replace('#', '');
  if (!/^[a-z0-9]{16,40}$/.test(topic)) { status('Ce lien est incomplet. Scanne à nouveau le code affiché dans YUNEO.', 'bad'); $('hint').hidden = true; return; }

  let channel = null, pc = null, sending = false;

  // ---- handshake through ntfy.sh (only a few lines of text, never the photos)
  async function waitForOffer() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), WAIT_OFFER_MS);
    let since = 'all';
    while (!ctrl.signal.aborted) {
      try {
        const res = await fetch(`${NTFY}/${topic}/sse?since=${since}`, { signal: ctrl.signal });
        const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
        for (;;) {
          const { value, done } = await reader.read(); if (done) break;
          buf += dec.decode(value, { stream: true });
          const parts = buf.split(/\r?\n\r?\n/); buf = parts.pop();
          for (const block of parts) {
            const data = block.split(/\r?\n/).filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trim()).join('');
            try { const o = JSON.parse(data); if (o.event !== 'message') continue; since = o.id; const m = JSON.parse(o.message); if (m.t === 'offer' && String(m.s).startsWith('v=0')) { clearTimeout(timer); ctrl.abort(); return m.s; } } catch (e) { /* noise */ }
          }
        }
      } catch (e) { if (ctrl.signal.aborted) break; }
      await new Promise((r) => setTimeout(r, 1200));
    }
    clearTimeout(timer);
    return null;
  }

  function iceComplete() {
    return new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const check = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', check); resolve(); } };
      pc.addEventListener('icegatheringstatechange', check); setTimeout(resolve, ICE_WAIT_MS);
    });
  }

  async function connect() {
    const offer = await waitForOffer();
    if (!offer) { status("Je ne trouve pas ton ordinateur. Ouvre YUNEO sur l'ordinateur (« Photos depuis mon iPhone »), vérifie le Wi-Fi, puis scanne à nouveau le code.", 'bad'); return; }
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.ondatachannel = (ev) => {
      channel = ev.channel; channel.binaryType = 'arraybuffer';
      channel.onopen = () => { status('Connecté à ton ordinateur ✓', 'ok'); $('hint').textContent = 'Choisis les photos des articles, dans l\'ordre.'; $('pick').hidden = false; };
      channel.onclose = () => { if (!sending) return; status('La connexion avec l\'ordinateur s\'est coupée. Recommence en scannant le code.', 'bad'); };
    };
    pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') status('Connexion impossible. Vérifie que les deux appareils sont sur le même Wi-Fi (pas en 4G, pas sur un réseau invité).', 'bad'); };
    await pc.setRemoteDescription({ type: 'offer', sdp: offer });
    await pc.setLocalDescription(await pc.createAnswer());
    await iceComplete();
    const text = JSON.stringify({ t: 'answer', s: pc.localDescription.sdp });
    await fetch(`${NTFY}/${topic}`, { method: 'POST', body: text });
  }

  // ---- photos: decode (HEIC included), resize, JPEG
  async function toJpeg(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image(); img.src = url; await img.decode();
      const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      return await new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error('jpeg'))), 'image/jpeg', QUALITY));
    } finally { URL.revokeObjectURL(url); }
  }
  const room = () => new Promise((resolve) => { if (channel.bufferedAmount < 4 * 1024 * 1024) return resolve(); channel.bufferedAmountLowThreshold = 1024 * 1024; channel.onbufferedamountlow = () => { channel.onbufferedamountlow = null; resolve(); }; });

  async function sendAll(list) {
    sending = true; $('pick').disabled = true; $('bar').hidden = false; $('bar').max = list.length; $('bar').value = 0;
    try { await navigator.wakeLock?.request('screen'); } catch (e) { /* optional */ }
    const files = [...list].sort((a, b) => (a.lastModified - b.lastModified) || a.name.localeCompare(b.name, undefined, { numeric: true }));
    channel.send(JSON.stringify({ t: 'hello', n: files.length }));
    let skipped = 0, sent = 0;
    for (const [i, file] of files.entries()) {
      status(`Envoi de la photo ${i + 1} / ${files.length}…`);
      try {
        const blob = await toJpeg(file); const buf = await blob.arrayBuffer();
        channel.send(JSON.stringify({ t: 'file', name: file.name.replace(/\.[^.]+$/, '') + '.jpg', size: buf.byteLength, lastModified: file.lastModified }));
        for (let o = 0; o < buf.byteLength; o += CHUNK) { await room(); channel.send(buf.slice(o, o + CHUNK)); }
        channel.send(JSON.stringify({ t: 'end' })); sent++;
      } catch (e) { skipped++; }
      $('bar').value = i + 1;
    }
    channel.send(JSON.stringify({ t: 'done' }));
    sending = false;
    status(skipped ? `Terminé : ${sent} photos envoyées, ${skipped} illisible(s) ignorée(s).` : `Terminé ✓ ${sent} photos envoyées. Retourne sur ton ordinateur.`, skipped ? '' : 'ok');
    $('hint').textContent = 'Tu peux fermer cette page.'; $('pick').hidden = true;
  }

  $('pick').addEventListener('click', () => $('files').click());
  $('files').addEventListener('change', (e) => { if (e.target.files.length) sendAll(e.target.files); });
  connect().catch(() => status('Quelque chose a échoué. Scanne à nouveau le code affiché dans YUNEO.', 'bad'));
})();
</script>
</body>
</html>
